[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armageddon"
version = "0.2.0"
description = "Inverse kinematics for a 6-DoF robot arm from scratch: pure NumPy solvers, MuJoCo physics"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nonberw" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "mujoco>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "imageio>=2.31", "pillow>=10.0", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/nonberw/armageddon"

[tool.setuptools]
packages = ["armageddon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
